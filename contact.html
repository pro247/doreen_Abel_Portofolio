            <div class="message-form-panel">

                    <div class="form-row-split">
                        <div class="input-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" required>
                        </div>
                        <div class="input-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" required>
                    </div>

                    <div class="input-group">
                        <label for="subject-line">Subject</label>
                        <input type="text" id="subject-line" required>
                    </div>

                    <div class="input-group">
                        <label for="message-box">Message</label>
                        <textarea id="message-box" rows="5" required></textarea>
                    </div>

                    <!-- Centered large action input submission button -->
                    <button type="submit" class="btn btn-submit-node">Send message</button>
