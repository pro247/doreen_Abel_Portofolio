<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doreen Providence Abel | Engineering Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <script>

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body class="site-wrapper error-body-canvas">



    <!-- MAIN CENTERED EXCEPTION PANEL (Matches your Figma 404 Layout perfectly) -->
    <main class="main-content error-page-alignment">
        <section class="error-centered-panel">
            <h1 class="error-code-title">404</h1>
            <h2>System Exception: Page Not Found</h2>
            <p class="error-subtitle">The requested file path does not exist on this node. Lets redirect you back to the main engineering
                terminal.</p>

            <!-- Absolute link redirects user safely back to the working index home node -->
            <a href="index.html" class="btn btn-return">Return to Home</a>
        </section>
    </main>



</body>

</html>
